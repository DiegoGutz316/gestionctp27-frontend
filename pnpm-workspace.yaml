# Solo configuracion de pnpm (este repo NO es un monorepo/workspace).
# Dependencias con scripts de build nativos aprobados:
allowBuilds:
  sharp: true
  unrs-resolver: true

# Retrasa paquetes recien publicados 7 dias para recortar malware de npm.
minimumReleaseAge: 10080
# Rechaza actualizaciones si baja la senal de confianza (provenance/firmas).
trustPolicy: no-downgrade


